<!DOCTYPE html>
<html lang="en">
  {% include head.html %}

  <body class="{% if page.url == '/' %}page-home{% elsif page.layout == 'post' %}page-post{% elsif page.url == '/about/' %}page-about{% else %}page-page{% endif %}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}

    <main class="page-content" id="main-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {% include footer.html %}
  </body>
</html>
